<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Easy Find</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Easy Find</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center mb-4">Buscar Easy Find (v1.0.1)</h2>
                <div class="card">
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="codigoInput" class="form-label">Ingresa el código:</label>
                            <input type="number" id="codigoInput" class="form-control" placeholder="Ej. 7915702">
                        </div>
                        <button id="buscarBtn" class="btn btn-primary w-100">Buscar</button>
                    </div>
                </div>
                <div id="resultados" class="mt-4">
                    <h5>Resultados:</h5>
                    <ul class="list-group" id="listaResultados"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const data = {
            3109055: '**EF:*1*** -3109055 - CACHERA PARA LAVATORIO PFISTER CLASIC #040-CSLPC 1M/PAL*****G1-F3',
            7005319: '**EF:*2*** -7005319 - CACHERA PARA LAVATORIO PFISTER CLASIC #040-CSVPC 1M/COPA*****G1-F3',
            3109054: '**EF:*3*** -3109054 - CACHERA PARA LAVATORIO PFISTER CLASIC #040-CSCPC 1M/CRUZ*****G1-F3',
            3291372: '**EF:*4*** -3291372 - CACHERA LAV PUSH 1H  042PF0C PFIRST PFISTER*****G1-F3',
            3000778: '**EF:*5*** -3000778 - CACHERA PARA LAVATORIO PFISTER CLASIC #048-CSCPC 2M/CRUZ*****G1-F3',
            3000779: '**EF:*6*** -3000779 - CACHERA PARA LAVATORIO PFISTER CLASIC #048-CSLPC 2M/PAL*****G1-F3',
            3006927: '**EF:*7*** -3006927 - CACHERA PARA LAVATORIO PFISTER CLASIC #1435000 2M/COPA*****G1-F3',
            7972803: '**EF:*8*** -7972803 - CACHERA PARA LAVATORIO TIPO BAR 2H 043G2LC PFISTER*****G1-F3',
            3291397: '**EF:*14*** -3291397 - CACHERA P.P LAV. MAIA 2 MANIJAS 048PFLC CROMO*****G1-F2',
            3291370: '**EF:*15*** -3291370 - CACHERA LAVATORIO TIPO BAR 2H 043PF0C PFIRST PFISTER*****G1-F2',
            3128774: '**EF:*16*** -3128774 - CACHERA PARA LAVATORIO PFISTER BARI 4" CROMO 048BALC*****G1-F2',
            7974729: '**EF:*17*** -7974729 - CACHERA PARA LAVATORIO KARCI 4" SATINADA PFISTER LF048KAGS*****G1-F2',
            7974728: '**EF:*18*** -7974728 - CACHERA PARA LAVATORIO KARCI 4" CROMO PFISTER LF048KACC*****G1-F2',
            7974727: '**EF:*23*** -7974727 - CACHERA P.P LAV. ZEELAN MONOCOMANDO CROMO LF042ZLC*****G1-F1',
            3128773: '**EF:*24*** -3128773 - CACHERA PARA LAVATORIO PFISTER BARI MONOCOM CROMO 042BALC*****G1-F1',
            7974733: '**EF:*25*** -7974733 - CACHERA PARA LAVATORIO VENTURI MONO NEGRO PFISTER LF042VNBB*****G1-F1',
            7974732: '**EF:*26*** -7974732 - CACHERA PARA LAVATORIO VENTURI MONO SAT PFISTER LF042VNGS*****G1-F1'
        };

        function resetForm() {
            document.getElementById('codigoInput').value = '';
            document.getElementById('codigoInput').focus();
        }

        function agregarResultado(mensaje, esExito) {
            const lista = document.getElementById('listaResultados');
            const item = document.createElement('li');
            item.className = 'list-group-item ' + (esExito ? 'list-group-item-success' : 'list-group-item-danger');
            item.textContent = mensaje;
            lista.appendChild(item);
        }

        function buscarCodigo() {
            const codigo = document.getElementById('codigoInput').value;

            if (codigo in data) {
                Swal.fire({
                    title: `${codigo}`,
                    text: `El Easy Find del código es: ${data[codigo]}`,
                    icon: 'success',
                    timer: 2500,
                    timerProgressBar: true
                });
                agregarResultado(`${codigo} - ${data[codigo]}`, true);
            } else {
                Swal.fire({
                    title: 'Error',
                    text: 'Código no encontrado',
                    icon: 'error',
                    timer: 2500,
                    timerProgressBar: true
                });
                agregarResultado(`${codigo} - Código no encontrado`, false);
            }

            resetForm();
        }

        document.getElementById('buscarBtn').addEventListener('click', buscarCodigo);
        document.getElementById('codigoInput').addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                buscarCodigo();
            }
        });
    </script>

</body>

</html>
